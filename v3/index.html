<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mainchess DGT a través de WebUSB</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.0.4/assets/chessground.base.css">
    <link rel="stylesheet" href="plugins/chessground/colors.css">
    <link rel="stylesheet" href="plugins/chessground/pieces.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js" integrity="sha384-s3XgLpvmHyscVpijnseAmye819Ee3yaGa8NxstkJVyA6nuDFjt59u1QvuEl/mecz" crossorigin="anonymous"></script>
    
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .left-section, .right-section {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
        }

        .left-section {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
        }

        .right-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background-color: #ffffff;
        }

        .right-section p, .right-section button {
            margin-bottom: 10px;
        }

    </style>

    <script type="module">
        function mostrarObjetoEnCuadro(objeto) {
            var cuadro = document.getElementById('cuadro');
            var lista = document.createElement('ul');

            for (var propiedad in objeto) {
                if (objeto.hasOwnProperty(propiedad)) {
                    var elementoLista = document.createElement('li');
                    var texto = document.createTextNode(propiedad + ': ' + objeto[propiedad]);
                    elementoLista.appendChild(texto);
                    lista.appendChild(elementoLista);
                }
            }
            cuadro.appendChild(lista);
        }

        import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.0.4/dist/chessground.js';
        import Board from './lib/Board.js';
        
        var showArrows = false;
        var turnLetter = 'w';

        (function () {
            window.loadBoard = loadBoard;
            let board, chessground, chessgroundAux, game, turnColor;

            function setChessGround() {
                game.load(chessgroundAux.getFen());
                chessground.set({
                    fen: chessgroundAux.getFen(),
                    orientation: 'white',
                    disableContextMenu: true,
                    turnColor: game.turn() === 'w' ? 'white' : 'black',
                    check: game.in_check(),
                    highlight: {
                        lastMove: true,
                        check: true
                    },
                    animation: {
                        enabled: true,
                        duration: 1000
                    },
                    movable: {
                        free: false
                    }
                });
            }

            async function loadBoard() {
                const port = await getPort();
                if (!port) throw new Error('Ningún puerto disponible.');
                await port.open({ baudRate: 9600 });

                board = new Board(port);
                const { serialNr, version, position } = await board.reset();
                document.getElementById('serialnr').innerHTML = serialNr;
                document.getElementById('version').innerHTML = version;
                game = new Chess();

                chessgroundAux = Chessground(document.getElementById('chessgroundAux'), {
                    fen: '8/8/8/8/8/8/8/8/8',
                    orientation: 'white',
                    disableContextMenu: true,
                    trustAllEvents: true,
                    movable: { free: false }
                });
                chessgroundAux.setPieces(position);

                mostrarObjetoEnCuadro(position);
                var FEN = chessgroundAux.getFen() + " " + turnLetter + " - - 0 1";

                game.load(FEN);
                document.getElementById('fen').innerHTML = FEN;
                document.getElementById('info').innerHTML = JSON.stringify(Array.from(position), null, 2);

                // setTimeout(function () {
                    chessground = Chessground(document.getElementById('chessground'), {
                        fen: FEN,
                        orientation: 'white',
                        disableContextMenu: true,
                        turnColor: game.turn() === 'w' ? 'white' : 'black',
                        check: game.in_check(),
                        highlight: {
                            lastMove: true,
                            check: true
                        },
                        animation: {
                            enabled: true,
                            duration: 500
                        },
                        movable: { free: false }
                    });
                // }, 1000);

                const reader = board.getReader();
                var from = "", to = "", role = "";
                while (true) {
                    const { value } = await reader.read();
                    chessgroundAux.setPieces(value);

                    if (from.length <= 0 && to.length <= 0) {
                        from = Array.from(value)[0][0];
                        role = Array.from(value)[0][1];
                        document.getElementById('desde').innerHTML = from;
                        // setTimeout(() => {
                            if (to == '') {
                                // from = '';
                                setChessGround();
                            }
                        // }, 1000);
                    } else {
                      // window.alert('TO')
                        to = Array.from(value)[0][0];
                        role = Array.from(value)[0][1];
                        document.getElementById('hasta').innerHTML = to;

                        if (role) {
                            document.getElementById('hasta').innerHTML += " " + role.role + " " + role.color;
                            document.getElementById('turno').innerHTML = role.color === 'white' ? 'black' : 'white';
                            turnColor = role.color === "black" ? "white" : "black";
                            turnLetter = turnColor === "black" ? "b" : "w";
                            FEN = chessground.getFen() + " " + turnLetter + " - - 0 1";
                            document.getElementById('fen').innerHTML = FEN;
                        } else from = '';

                        if (from && to) {
                            chessground.move(from, to);
                            FEN = chessground.getFen() + " " + turnLetter + " - - 0 1";
                            game.load(FEN);
                            document.getElementById('fen').innerHTML = FEN;
                            document.getElementById('info').innerHTML = JSON.stringify(Array.from(value), null, 2);

                            if (chessgroundAux.getFen() != chessground.getFen()) 
                              setChessGround();
                            from = to = '';
                        }
                        from = '';
                    }
                }
            }

            async function getPort() {
                const ports = await navigator.serial.getPorts();
                for (const port of ports) {
                    for (const filter of Board.FILTERS) {
                        if (port.productId === filter.productId && port.vendorId === filter.vendorId) return port;
                    }
                }
                return await navigator.serial.requestPort({ filters: [] });
            }

            window.loadBoard = loadBoard;
        })();
    </script>
</head>
<body onload="loadBoard()">
    <div class="left-section">
        <div id="chessground" style="width: 600px; height: 600px;"></div>
    </div>
    <div class="right-section">
        <button onclick="loadBoard()">Cargar posición del tablero DGT</button>
        <p><strong>Puerto serie Nr:</strong> <span id="serialnr">n/a</span> | <strong>Versión:</strong> <span id="version">n/a</span></p>
        <p><strong>Turno:</strong> <span id="turno"></span> | <strong>Movimiento:</strong> <span id="juego"></span></p>
        <p><strong>FEN:</strong> <span id="fen"></span></p>
        <p><strong>DESDE:</strong> <span id="desde"></span> | <strong>HASTA:</strong><span id="hasta"></span></p>
        <p><strong>INFO DRIVER:</strong> <span id="info"></span></p>
        <div id="cuadro"></div>
    </div>
    <div id="chessgroundAux" style="width: 600px; display: none; height: 600px;"></div>
</body>
</html>
