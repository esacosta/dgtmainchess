    <style>
      :root {
        --bg: #0b1221;
        --panel: #11182b;
        --border: #1f2c45;
        --accent: #4da3ff;
        --text: #e8eefc;
        --muted: #9db0d6;
        --board-max-size: 640px;
        --vertical-safe-space: 260px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 10% 20%, rgba(77, 163, 255, 0.15), transparent 25%),
                    radial-gradient(circle at 90% 10%, rgba(146, 111, 255, 0.2), transparent 20%),
                    radial-gradient(circle at 80% 90%, rgba(77, 163, 255, 0.12), transparent 25%),
                    var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      .app {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }

      .header {
        background: rgba(17, 24, 43, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .title-block h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.2px;
      }

      .title-block p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .primary-btn {
        background: linear-gradient(135deg, #4da3ff, #6b7bff);
        color: white;
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        letter-spacing: 0.2px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(77, 163, 255, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 26px rgba(77, 163, 255, 0.4);
      }

      .layout {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 20px;
      }

      .card {
        background: rgba(17, 24, 43, 0.85);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 16px;
        letter-spacing: 0.2px;
        color: var(--muted);
      }

      .board-shell {
        background: #0c1426;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 12px;
      }

      #chessground {
        width: min(100%, var(--board-max-size));
        max-width: min(var(--board-max-size), max(0px, calc(100vh - var(--vertical-safe-space))));
        max-height: max(0px, calc(100vh - var(--vertical-safe-space)));
        aspect-ratio: 1 / 1;
        height: auto;
        margin: 0 auto;
      }

      #chessgroundAux {
        display: none;
        width: 100%;
        height: 600px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .info-item {
        background: #0f192c;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .info-item strong {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .info-item span {
        font-size: 15px;
        word-break: break-word;
      }

      #cuadro {
        margin-top: 14px;
        padding: 12px 14px;
        background: #0f192c;
        border: 1px solid var(--border);
        border-radius: 12px;
        max-height: 180px;
        overflow: auto;
      }

      ul {
        margin: 0;
        padding-left: 16px;
      }

      .status-line {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 14px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(77, 163, 255, 0.12);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(77, 163, 255, 0.35);
        font-size: 13px;
      }
      /* Estilo para la ventana modal */
    #myModal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.55);
      }
      
      /* Contenido de la ventana modal */
      #myModal-content {
        background-color: #0f192c;
        margin: 12% auto;
        padding: 24px;
        border: 1px solid var(--border);
        width: 420px;
        max-width: 90%;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        border-radius: 12px;
        color: var(--text);
      }

      /* Título de la ventana modal */
      #modal-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 14px;
        letter-spacing: 0.3px;
      }

      #inicioJuegoForm label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      #inicioJuegoForm button {
        margin-top: 6px;
      }

        background-repeat: no-repeat;

    <script type="module">
      import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.0.4/dist/chessground.js';
      import Board from './lib/Board.js'
      var showArrows = false;
      var turnLetter = 'w';
      const toDests = (chess) => {
        const dests = {};
        chess.SQUARES.forEach((s) => {
          const ms = chess.moves({ square: s, verbose: true });
          if (ms.length) dests[s] = ms.map((m) => m.to);
        });
        const color = chess.turn() === "w" ? "white" : "black";

        return {
          color, // who's turn is it
          dests, // what to move
          free: false
        };
      };
      

      // Función para mostrar el objeto en un cuadro de forma genérica
  function mostrarObjetoEnCuadro(objeto) {
    // Obtener el elemento cuadro por su ID
    var cuadro = document.getElementById('cuadro');
    console.log('mostrarObjetoEnCuadro')
    // Crear un elemento de lista no ordenada (ul)
    var lista = document.createElement('ul');

    // Iterar sobre las propiedades del objeto
    for (var propiedad in objeto) {
      console.log(propiedad)
      if (objeto.hasOwnProperty(propiedad)) {
        // Crear un elemento de lista (li) para cada propiedad
        var elementoLista = document.createElement('li');

        // Crear un texto con el nombre de la propiedad y su valor
        var texto = document.createTextNode(propiedad + ': ' + objeto[propiedad]);

        // Agregar el texto al elemento de lista
        elementoLista.appendChild(texto);

        // Agregar el elemento de lista a la lista
        lista.appendChild(elementoLista);
      }
    }

    // Agregar la lista al cuadro
    cuadro.appendChild(lista);
  }
      (function () {
        window.loadBoard = loadBoard
        
        let board
        let chessground
        let chessgroundAux
        let game
        let turnColor
        function setChessGround() {
          chessground.set({
              fen: chessgroundAux.getFen(),
              orientation: 'white',
              disableContextMenu: true,
              turnColor: turnColor,
              check: game.in_check(),
              highlight: {
                lastMove: true, // add last-move class to squares
                check: true, // add check class to squares
              },
              animation: {
                enabled: true,
                duration: 1000,
              },
              movable: {
                free: false
              }
            })
        }
        async function loadBoard () {
          const port = await getPort()
          if (!port) {
            throw new Error('Ningún puerto disponible.')
          }
          await port.open({ baudRate: 9600 })

          board = new Board(port)
          const { serialNr, version, position } = await board.reset()
          document.getElementById('serialnr').innerHTML = serialNr
          document.getElementById('version').innerHTML = version
          game = new Chess()
          
          chessgroundAux = Chessground(document.getElementById('chessgroundAux'), {
            fen: '8/8/8/8/8/8/8/8/8',
            orientation: 'white',
            disableContextMenu: true,
            trustAllEvents: true,
            movable: {
              free: false
            }
          });
          
          chessgroundAux.setPieces(position)
          var blancasRadio = document.getElementById("blancasRadio");
          turnLetter = blancasRadio.checked ? 'w' : 'b';
          var FEN = chessgroundAux.getFen() +  " " + turnLetter + " - - 0 1";


          game.load(FEN)
          console.log('Color: ' + game.turn())
          
          console.log('FEN: ' + game.fen())
          console.log('INCHECK ' + game.in_check());
          document.getElementById('fen').innerHTML = FEN
          mostrarObjetoEnCuadro(position)
          document.getElementById('info').innerHTML = JSON.stringify(Array.from(position), null, 2)
          console.log(position)
          
          var from = ""
          var to = ""
          var from2 = ""
          var to2 = ""
          turnColor = game.turn() === "w" ? "white" : "black";
          document.getElementById('turno').innerHTML = turnColor
          console.log(position.ascii)
          chessground = Chessground(document.getElementById('chessground'), {
            fen: FEN,
            orientation: 'white',
            disableContextMenu: true,
            turnColor: turnColor,
            check: game.in_check(),
            highlight: {
              lastMove: true, // add last-move class to squares
              check: true, // add check class to squares
            },
            animation: {
              enabled: true,
              duration: 1000,
            },
            movable: {
              free: false
            }
          })
          const reader = board.getReader()
          while (true) {
            const { value } = await reader.read()
            chessgroundAux.setPieces(value)
            // game.load(chessgroundAux.getFen())
//             turnColor = game.turn() === "w" ? "white" : "black";

   //          console.log('Color: ' + turnColor)
      //       console.log('FEN: ' + game.fen())
            
            //document.getElementById('turno').innerHTML = turnColor

            var role = "";
            if (from.length <= 0)
            {
              from = Array.from(value)[0][0]
              role = Array.from(value)[0][1];
              console.log('FROM ' + from)
              if (role)
              {
                console.log('ROLE FROM' + JSON.stringify(role.role))
              }
              
              document.getElementById('desde').innerHTML = from;
              setTimeout(() => {
                if (to == '')
                {
                  from = ''
                  setChessGround();
                }
              }, "1000");
            }
            else
            {
              to = Array.from(value)[0][0]
              role = Array.from(value)[0][1];
              console.log('TO ' + to)
              document.getElementById('hasta').innerHTML = to;
              if (role)
              {
                console.log('ROLE TO' + JSON.stringify(role.role))
                document.getElementById('hasta').innerHTML += " " + role.role + " " + role.color;
                // window.alert('Coronación');
                // chessground.setPieces(value);
              }
              else
                from = ''
            }
            // document.getElementById('info').innerHTML = from + to
            // document.getElementById('info').innerHTML = JSON.stringify(Array.from(value), null, 2)
            // document.getElementById('fen').innerHTML = game.fen()
            

            if (from != null && to != null && from.length > 0 && to.length > 0)
            {
              turnColor = role.color === "black" ? "white" : "black";
              turnLetter = role.color === "black" ? "b" : "w";
              
              FEN = chessground.getFen() +  " " + turnLetter + " - - 0 1";
              game.load(FEN)
              console.log('FEN: ' + game.fen())

              // Verificar si el movimiento 'e2e4' es legal
              var movimientoLegal = game.move({ from: from, to: to });
              chessground.move(from, to);

              // Imprimir el resultado en la consola
              if (movimientoLegal !== null) {
                console.log('El movimiento es legal.');
                document.getElementById('juego').innerHTML = from + to + " Movimiento legal";
              } else {
                console.log('El movimiento no es legal.');
                document.getElementById('juego').innerHTML = from + to + " Movimiento ilegal";
              }

              document.getElementById('turno').innerHTML = turnColor
              document.getElementById('info').innerHTML = JSON.stringify(Array.from(value), null, 2)
              console.log('Color: ' + game.turn())
              
              console.log('INCHECK ' + game.in_check());

              if (chessgroundAux.getFen() != chessground.getFen())
              {
                setChessGround();
              }
              
              from = '';
              to = '';
            }
          }
        }
        
        async function getPort () {
          const ports = await navigator.serial.getPorts()
          for (const port of ports) {
            for (const filter of Board.FILTERS) {
              if (port.productId === filter.productId && port.vendorId === filter.vendorId) {
                return port
              }
            }
          }

          // do not use `Board.FILTERS` as of now since we do not
          //   know all valid identifiers, also when using a VM etc.
          const filters = []
          return await navigator.serial.requestPort({
            filters: filters
          })
        }
      })()
    </script>

    <div class="app">
      <div class="header">
        <div class="title-block">
          <h1>Mainchess DGT via WebUSB</h1>
          <p>Visualización del tablero DGT sin necesidad de software de DGT, a través de WebUSB (por esacosta).</p>
        </div>
        <button class="primary-btn" onclick="loadBoard()">Cargar posición del tablero DGT</button>
      </div>

      <div class="layout">
        <div class="card">
          <h2>Tablero en vivo</h2>
          <div class="board-shell">
            <div id="chessground"></div>
          </div>
        </div>

        <div class="card">
          <h2>Estado y detalles</h2>
          <div class="info-grid">
            <div class="info-item">
              <strong>Puerto serie Nr</strong>
              <span id="serialnr">n/a</span>
            </div>
            <div class="info-item">
              <strong>Versión</strong>
              <span id="version">n/a</span>
            </div>
            <div class="info-item">
              <strong>Turno</strong>
              <span id="turno" class="pill"></span>
            </div>
            <div class="info-item">
              <strong>Movimiento</strong>
              <span id="juego"></span>
            </div>
            <div class="info-item">
              <strong>FEN</strong>
              <span id="fen"></span>
            </div>
            <div class="info-item">
              <strong>Desde / Hasta</strong>
              <div class="status-line">
                <span class="pill" id="desde"></span>
                <span class="pill" id="hasta"></span>
              </div>
            </div>
            <div class="info-item" style="grid-column: span 2;">
              <strong>INFO DRIVER</strong>
              <span id="info"></span>
            </div>
          </div>
          <div id="cuadro"></div>
        </div>
      </div>

      <div id="chessgroundAux"></div>
    </div>
    
<!-- Botón para abrir la ventana modal -->

<!-- Ventana modal -->
<div id="myModal">
  <div id="myModal-content">
    <div id="modal-title">Selecciona el color para empezar</div>
    <form id="inicioJuegoForm">
      <label>
        <input type="radio" name="color" id="blancasRadio"> Blancas
      </label>
      <label>
        <input type="radio" name="color" id="negrasRadio"> Negras
      </label>
      <button type="button" onclick="verificarInicioJuego()">Confirmar</button>
    </form>
  </div>
</div>

<script >
  // Función para abrir la ventana modal
  function abrirModal() {
    var modal = document.getElementById("myModal");
    modal.style.display = "block";
  }

  // Función para verificar quién empieza jugando
  function verificarInicioJuego() {
    
    var blancasRadio = document.getElementById("blancasRadio");
    var negrasRadio = document.getElementById("negrasRadio");
    
    if (blancasRadio.checked || negrasRadio.checked) {
      var modal = document.getElementById("myModal");
      modal.style.display = "none";

      if (blancasRadio.checked) {
        // alert("¡Comienzan las blancas!");
        turnLetter  = 'w';
        loadBoard();
      } else {
        // alert("¡Comienzan las negras!");
        turnLetter = 'b';
        loadBoard();
      }
    } else {
      alert("Por favor, elija un color para comenzar.");
    }
  }
</script>
